name: Gemini Proxy Rotation

on:
  schedule:
    # زمان‌بندی رو به وقت UTC تنظیم کنید (مثلاً هر ۴ ساعت)
    # برای ۶ مخزن، می‌توانید کرون را پلکانی تنظیم کنید
    - cron: '0 */4 * * *' 
  workflow_dispatch: # امکان اجرای دستی برای تست

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # محدودیت ۴ ساعت (۲۴۰ دقیقه)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Proxy and Tunnel
        run: |
          chmod +x start.sh
          ./start.sh
