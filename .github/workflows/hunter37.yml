name: Hunter37 Jev Decision Worker

on:
  push:
    paths:
      - 'hunter37/requests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunter37-jev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  jev:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hunter37 repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install worker dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Process Hunter37 requests
        env:
          HUNTER37_JEV_API_KEY: ${{ secrets.HUNTER37_JEV_API_KEY }}
        run: python hunter37_worker.py
