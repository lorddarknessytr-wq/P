name: TLP Gemini Proxy Worker

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tlp-gemini-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out proxy repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run queue worker
        env:
          GH_TOKEN: ${{ github.token }}
          HUNTER_QUEUE_PRIVATE_KEY: ${{ secrets.HUNTER_QUEUE_PRIVATE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          POLL_SECONDS: "3"
          WORKER_MAX_RUNTIME_SECONDS: "21300"
        run: python -u worker.py
