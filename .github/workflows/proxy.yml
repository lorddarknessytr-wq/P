name: Gemini Proxy
on:
  workflow_dispatch:

permissions:
  contents: write # ⭐ این خط برای اجازه دادن به آپدیت فایل لازم است

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Proxy and Save URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x start.sh
          ./start.sh
