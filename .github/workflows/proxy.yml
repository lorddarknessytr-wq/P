name: TLP Gemini Proxy + Local Decision Model

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tlp-proxy-decision-${{ github.repository }}
  cancel-in-progress: false

jobs:
  proxy-and-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache local Qwen model
        uses: actions/cache@v4
        with:
          path: ~/.cache/tlp-ai
          key: tlp-qwen3-4b-q4km-v1

      - name: Install proxy and worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install CPU inference runtime
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas-dev cmake ninja-build
          python -m pip install --upgrade scikit-build-core
          CMAKE_ARGS="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS" python -m pip install --no-cache-dir llama-cpp-python==0.3.36

      - name: Start Gemini proxy, Cloudflare tunnel, and Qwen decision worker
        env:
          GH_TOKEN: ${{ github.token }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TLP_MODEL_CACHE: ~/.cache/tlp-ai
        run: bash start.sh
